name: build-image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          # --format docker: keep Dockerfile HEALTHCHECK (dropped by OCI format)
          podman build --format docker \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:$SHORT_SHA \
            .

      - name: Push image
        run: |
          set -eu
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman push ghcr.io/${{ github.repository }}:latest
          podman push ghcr.io/${{ github.repository }}:$SHORT_SHA
          podman logout ghcr.io